name: Evelly Online

on:
  workflow_dispatch:

  push:
    branches:
      - main

  repository_dispatch:
    types:
      - evelly_restart

permissions:
  contents: write

concurrency:
  group: evelly-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Evelly Online
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # BAIXAR CÃƒÆ’Ã¢â‚¬Å“DIGO
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¥ Baixar cÃƒÆ’Ã‚Â³digo da Evelly
        uses: actions/checkout@v6


      # ==========================================
      # PYTHON
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã‚ÂÃ‚Â Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"


      # ==========================================
      # BUN
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â£ Instalar Bun
        uses: oven-sh/setup-bun@v2


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â¢ Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ==========================================
      # DEPENDÃƒÆ’Ã…Â NCIAS PYTHON
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¦ Instalar dependÃƒÆ’Ã‚Âªncias
        run: |
          python -m pip install --upgrade pip

          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¦ INSTALANDO DEPENDÃƒÆ’Ã…Â NCIAS"
          echo "=============================================="

          pip install -r requirements.txt

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Âº Atualizando yt-dlp..."
          python -m pip install -U "yt-dlp[default]"

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â Instalando PO Token Provider..."
          python -m pip install -U bgutil-ytdlp-pot-provider

          echo ""
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ…Â½ VERSÃƒÆ’Ã¢â‚¬Â¢ES"
          echo "=============================================="

          python --version

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Âº yt-dlp:"
          python -m pip show yt-dlp

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â bgutil:"
          python -m pip show bgutil-ytdlp-pot-provider

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â£ Bun:"
          bun --version
          which bun

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "=============================================="


      # ==========================================
      # BGUTIL PO TOKEN SERVER
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â Preparar servidor PO Token
        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â CONFIGURANDO BGUTIL PO TOKEN PROVIDER"
          echo "=============================================="

          git clone --depth 1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¦ Instalando dependÃƒÆ’Ã‚Âªncias do provider..."
          npm ci

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂºÃ‚Â ÃƒÂ¯Ã‚Â¸Ã‚Â Compilando provider..."
          npx tsc

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã…Â¡Ã¢â€šÂ¬ Iniciando servidor PO Token..."

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          cd ../..

          echo ""
          echo "ÃƒÂ¢Ã‚ÂÃ‚Â³ Aguardando servidor..."
          sleep 5

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¡ Testando servidor PO Token..."

          curl --fail \
            --max-time 10 \
            http://127.0.0.1:4416/ping

          echo ""
          echo "=============================================="
          echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ PO TOKEN PROVIDER ONLINE"
          echo "=============================================="


      # ==========================================
      # JAVA 17 - LAVALINK
      # ==========================================
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # LAVALINK 4.2.2
      # ==========================================
      - name: Instalar e iniciar Lavalink
        run: |
          mkdir -p lavalink
          cd lavalink
          wget -q https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar

          printf '%s\n' 'server:' '  port: 2333' '' 'lavalink:' '  server:' '    password: "evelly123"' '    sources:' '      youtube: false' '      soundcloud: true' '      bandcamp: true' '      twitch: true' '      vimeo: true' '      http: true' '' '    plugins:' '      - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"' '        repository: "https://maven.lavalink.dev/releases"' '' 'plugins:' '  youtube:' '    enabled: true' '    allowSearch: true' '    allowDirectVideoIds: true' '    allowDirectPlaylistIds: true' '    clients:' '      - MUSIC' '      - WEB' '      - WEBEMBEDDED' '      - MWEB' '      - ANDROID_VR' '' 'logging:' '  level:' '    root: INFO' '    lavalink: INFO' > application.yml


          nohup java -jar Lavalink.jar > lavalink.log 2>&1 &

          echo "Aguardando Lavalink iniciar..."

          for i in {1..60}; do
            if curl -s http://127.0.0.1:2333/version > /dev/null; then
              echo "Lavalink iniciado com sucesso!"
              break
            fi
            sleep 2
          done

          echo "===== LOG DO LAVALINK ====="
          tail -n 50 lavalink.log

      # ==========================================
      # FFMPEG
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã…Â½Ã‚Âµ Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã…Â½Ã‚Âµ FFMPEG"
          echo "=============================================="

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo ""
          echo "=============================================="


      # ==========================================
      # PREPARAR COOKIES DO YOUTUBE
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â Preparar cookies do YouTube
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â BAIXANDO COOKIES DO YOUTUBE"
          echo "=============================================="

          COOKIE_URL="${SUPABASE_URL}/storage/v1/object/evelly-private/cookies.txt"

          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¥ Baixando cookies do bucket privado..."

          curl -fL \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$COOKIE_URL" \
            -o "$RUNNER_TEMP/youtube_cookies.txt"

          if [ ! -s "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "ÃƒÂ¢Ã‚ÂÃ…â€™ ERRO: arquivo de cookies nÃƒÆ’Ã‚Â£o foi baixado."
            exit 1
          fi

          echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ Cookies baixados com sucesso."
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â Arquivo temporÃƒÆ’Ã‚Â¡rio preparado."

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â Tamanho do arquivo:"
          wc -c < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã¢â‚¬Å¾ Quantidade de linhas:"
          wc -l < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "=============================================="
          echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ COOKIES PREPARADOS"
          echo "=============================================="
      # ==========================================
      # TESTAR DISCORD
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã…â€™Ã‚Â Testar conexÃƒÆ’Ã‚Â£o com Discord
        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã…â€™Ã‚Â TESTANDO DISCORD"
          echo "=============================================="

          curl -A "EvellyBot/1.0" \
            -i \
            --max-time 15 \
            https://discord.com/api/v10/gateway

          echo ""
          echo "=============================================="


      # ==========================================
      # TESTAR YT-DLP + PO TOKEN
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Âº Testar yt-dlp
        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Âº TESTANDO YT-DLP"
          echo "=============================================="

          python -m yt_dlp --version

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â£ Bun:"
          bun --version
          which bun

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã…Â¸Ã‚Â¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã‚ÂÃ‚Âª Arquivo de cookies:"
          if [ -f "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ youtube_cookies.txt encontrado."
            wc -c < "$RUNNER_TEMP/youtube_cookies.txt"
          else
            echo "ÃƒÂ¢Ã‚ÂÃ…â€™ youtube_cookies.txt NÃƒÆ’Ã†â€™O encontrado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â TESTANDO PO TOKEN PROVIDER"
          echo "=============================================="

          set +e

          python -m yt_dlp \
            --js-runtimes node \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --verbose \
            --skip-download \
            "https://www.youtube.com/watch?v=eyBhxuONsOA" \
            2>&1 | tee "$RUNNER_TEMP/ytdlp-test.log"

          YTDLP_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ‚Â FIM DO TESTE PO TOKEN"
          echo "=============================================="

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã…Â  CÃƒÆ’Ã‚Â³digo de saÃƒÆ’Ã‚Â­da do yt-dlp: $YTDLP_EXIT"

          echo ""
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ…Â½ RESUMO DO DIAGNÃƒÆ’Ã¢â‚¬Å“STICO"
          echo "=============================================="

          grep -Ei \
            "pot|bgutil|token|javascript|runtime|youtube|cookie|login|playability" \
            "$RUNNER_TEMP/ytdlp-test.log" \
            | head -n 180 || true

          echo ""
          echo "=============================================="

          if [ "$YTDLP_EXIT" -ne 0 ]; then
            echo "ÃƒÂ¢Ã…Â¡Ã‚Â ÃƒÂ¯Ã‚Â¸Ã‚Â O teste do yt-dlp falhou."
            echo "ÃƒÂ¢Ã…Â¡Ã‚Â ÃƒÂ¯Ã‚Â¸Ã‚Â Isso NÃƒÆ’Ã†â€™O impede o diagnÃƒÆ’Ã‚Â³stico."
            echo "ÃƒÂ¢Ã…Â¡Ã‚Â ÃƒÂ¯Ã‚Â¸Ã‚Â O log completo foi preservado acima."
          else
            echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ TESTE DO YT-DLP CONCLUÃƒÆ’Ã‚ÂDO COM SUCESSO."
          fi


      # ==========================================
      # INICIAR EVELLY
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã‚Â¤Ã¢â‚¬â€œ Iniciar Evelly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_COOKIE_FILE: ${{ runner.temp }}/youtube_cookies.txt

        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã…Â¡Ã¢â€šÂ¬ INICIANDO EVELLY"
          echo "=============================================="

          echo "ÃƒÂ¢Ã‚ÂÃ‚Â±ÃƒÂ¯Ã‚Â¸Ã‚Â Tempo mÃƒÆ’Ã‚Â¡ximo deste ciclo: 5h50"
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ¢â‚¬Å¾ ApÃƒÆ’Ã‚Â³s o ciclo, uma nova execuÃƒÆ’Ã‚Â§ÃƒÆ’Ã‚Â£o serÃƒÆ’Ã‚Â¡ criada."

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Âº Runtime JavaScript: Node.js"

          node --version
          node -p "process.execPath"

          echo ""
          echo "ÃƒÂ°Ã…Â¸Ã‚ÂÃ‚Âª YouTube Cookies: configurados"

          echo ""
          echo "=============================================="

          python bot.py


      # ==========================================
      # REINICIAR
      # ==========================================
      - name: ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ¢â‚¬Å¾ Solicitar reinÃƒÆ’Ã‚Â­cio da Evelly
        if: always()

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=============================================="
          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬ÂÃ¢â‚¬Å¾ PREPARANDO NOVO CICLO"
          echo "=============================================="

          echo "ÃƒÂ°Ã…Â¸Ã¢â‚¬Å“Ã‚Â¡ Solicitando nova execuÃƒÆ’Ã‚Â§ÃƒÆ’Ã‚Â£o..."

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="evelly_restart"

          echo "ÃƒÂ¢Ã…â€œÃ¢â‚¬Â¦ Novo ciclo solicitado!"
          echo "=============================================="

