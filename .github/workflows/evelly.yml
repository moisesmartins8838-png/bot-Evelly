name: Evelly Online

on:
  workflow_dispatch:

  push:
    branches:
      - main

  repository_dispatch:
    types:
      - evelly_restart

permissions:
  contents: write

concurrency:
  group: evelly-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Evelly Online
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # BAIXAR CÓDIGO
      # ==========================================
      - name: 📥 Baixar código da Evelly
        uses: actions/checkout@v6


      # ==========================================
      # PYTHON
      # ==========================================
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"


      # ==========================================
      # BUN
      # ==========================================
      - name: 🟣 Instalar Bun
        uses: oven-sh/setup-bun@v2


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ==========================================
      # DEPENDÊNCIAS PYTHON
      # ==========================================
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip

          echo "=============================================="
          echo "📦 INSTALANDO DEPENDÊNCIAS"
          echo "=============================================="

          pip install -r requirements.txt

          echo ""
          echo "📺 Atualizando yt-dlp..."
          python -m pip install -U "yt-dlp[default]"

          echo ""
          echo "🔐 Instalando PO Token Provider..."
          python -m pip install -U bgutil-ytdlp-pot-provider

          echo ""
          echo "=============================================="
          echo "🔎 VERSÕES"
          echo "=============================================="

          python --version

          echo ""
          echo "📺 yt-dlp:"
          python -m pip show yt-dlp

          echo ""
          echo "🔐 bgutil:"
          python -m pip show bgutil-ytdlp-pot-provider

          echo ""
          echo "🟣 Bun:"
          bun --version
          which bun

          echo ""
          echo "🟢 Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "=============================================="


      # ==========================================
      # BGUTIL PO TOKEN SERVER
      # ==========================================
      - name: 🔐 Preparar servidor PO Token
        run: |
          echo "=============================================="
          echo "🔐 CONFIGURANDO BGUTIL PO TOKEN PROVIDER"
          echo "=============================================="

          git clone --depth 1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo ""
          echo "📦 Instalando dependências do provider..."
          npm ci

          echo ""
          echo "🛠️ Compilando provider..."
          npx tsc

          echo ""
          echo "🚀 Iniciando servidor PO Token..."

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          cd ../..

          echo ""
          echo "⏳ Aguardando servidor..."
          sleep 5

          echo ""
          echo "📡 Testando servidor PO Token..."

          curl --fail \
            --max-time 10 \
            http://127.0.0.1:4416/ping

          echo ""
          echo "=============================================="
          echo "✅ PO TOKEN PROVIDER ONLINE"
          echo "=============================================="


      # ==========================================
      # FFMPEG
      # ==========================================
      - name: 🎵 Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=============================================="
          echo "🎵 FFMPEG"
          echo "=============================================="

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo ""
          echo "=============================================="


      # ==========================================
      # PREPARAR COOKIES DO YOUTUBE
      # ==========================================
      - name: 🔐 Preparar cookies do YouTube
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "=============================================="
          echo "🔐 PREPARANDO COOKIES DO YOUTUBE"
          echo "=============================================="

          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "❌ ERRO: YOUTUBE_COOKIES está vazio."
            echo "❌ Verifique o secret YOUTUBE_COOKIES no GitHub."
            exit 1
          fi

          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube_cookies.txt"

          if [ ! -s "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "❌ ERRO: arquivo de cookies não foi criado."
            exit 1
          fi

          echo "✅ Arquivo de cookies criado."
          echo "📁 Arquivo temporário preparado."

          echo ""
          echo "📏 Tamanho do arquivo:"
          wc -c < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "=============================================="
          echo "✅ COOKIES PREPARADOS"
          echo "=============================================="


      # ==========================================
      # TESTAR DISCORD
      # ==========================================
      - name: 🌐 Testar conexão com Discord
        run: |
          echo "=============================================="
          echo "🌐 TESTANDO DISCORD"
          echo "=============================================="

          curl -A "EvellyBot/1.0" \
            -i \
            --max-time 15 \
            https://discord.com/api/v10/gateway

          echo ""
          echo "=============================================="


      # ==========================================
      # TESTAR YT-DLP + PO TOKEN
      # ==========================================
      - name: 📺 Testar yt-dlp
        run: |
          echo "=============================================="
          echo "📺 TESTANDO YT-DLP"
          echo "=============================================="

          python -m yt_dlp --version

          echo ""
          echo "🟣 Bun:"
          bun --version
          which bun

          echo ""
          echo "🟢 Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "🍪 Arquivo de cookies:"
          if [ -f "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "✅ youtube_cookies.txt encontrado."
            wc -c < "$RUNNER_TEMP/youtube_cookies.txt"
          else
            echo "❌ youtube_cookies.txt NÃO encontrado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "🔐 TESTANDO PO TOKEN PROVIDER"
          echo "=============================================="

          set +e

          python -m yt_dlp \
            --js-runtimes node \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --verbose \
            --skip-download \
            "https://www.youtube.com/watch?v=eyBhxuONsOA" \
            2>&1 | tee "$RUNNER_TEMP/ytdlp-test.log"

          YTDLP_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "=============================================="
          echo "🔐 FIM DO TESTE PO TOKEN"
          echo "=============================================="

          echo ""
          echo "📊 Código de saída do yt-dlp: $YTDLP_EXIT"

          echo ""
          echo "=============================================="
          echo "🔎 RESUMO DO DIAGNÓSTICO"
          echo "=============================================="

          grep -Ei \
            "pot|bgutil|token|javascript|runtime|youtube|cookie|login|playability" \
            "$RUNNER_TEMP/ytdlp-test.log" \
            | head -n 180 || true

          echo ""
          echo "=============================================="

          if [ "$YTDLP_EXIT" -ne 0 ]; then
            echo "⚠️ O teste do yt-dlp falhou."
            echo "⚠️ Isso NÃO impede o diagnóstico."
            echo "⚠️ O log completo foi preservado acima."
          else
            echo "✅ TESTE DO YT-DLP CONCLUÍDO COM SUCESSO."
          fi


      # ==========================================
      # INICIAR EVELLY
      # ==========================================
      - name: 🤖 Iniciar Evelly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

        run: |
          echo "=============================================="
          echo "🚀 INICIANDO EVELLY"
          echo "=============================================="

          echo "⏱️ Tempo máximo deste ciclo: 5h50"
          echo "🔄 Após o ciclo, uma nova execução será criada."

          echo ""
          echo "📺 Runtime JavaScript: Node.js"

          node --version
          node -p "process.execPath"

          echo ""
          echo "🍪 YouTube Cookies: configurados"

          echo ""
          echo "=============================================="

          python bot.py


      # ==========================================
      # REINICIAR
      # ==========================================
      - name: 🔄 Solicitar reinício da Evelly
        if: always()

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=============================================="
          echo "🔄 PREPARANDO NOVO CICLO"
          echo "=============================================="

          echo "📡 Solicitando nova execução..."

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="evelly_restart"

          echo "✅ Novo ciclo solicitado!"
          echo "=============================================="