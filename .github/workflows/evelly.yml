name: Evelly Online

on:
  workflow_dispatch:

  push:
    branches:
      - main

  repository_dispatch:
    types:
      - evelly_restart

permissions:
  contents: write

concurrency:
  group: evelly-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Evelly Online
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Baixar código da Evelly
        uses: actions/checkout@v6

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: 🟣 Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip

          echo "=============================================="
          echo "📦 INSTALANDO DEPENDÊNCIAS"
          echo "=============================================="

          pip install -r requirements.txt

          echo ""
          echo "📺 Atualizando yt-dlp..."
          python -m pip install -U "yt-dlp[default]"

          echo ""
          echo "=============================================="
          echo "🔎 VERSÕES"
          echo "=============================================="

          python --version
          python -m pip show yt-dlp
          bun --version

          echo ""
          echo "=============================================="

      - name: 🎵 Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=============================================="
          echo "🎵 FFMPEG"
          echo "=============================================="

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: 🌐 Testar conexão com Discord
        run: |
          echo "=============================================="
          echo "🌐 TESTANDO DISCORD"
          echo "=============================================="

          curl -A "EvellyBot/1.0" \
            -i \
            --max-time 15 \
            https://discord.com/api/v10/gateway

          echo ""
          echo "=============================================="

      - name: 📺 Testar yt-dlp
        run: |
          echo "=============================================="
          echo "📺 TESTANDO YT-DLP"
          echo "=============================================="

          python -m yt_dlp --version

          echo ""
          echo "🟣 Bun:"
          bun --version

          echo ""
          echo "=============================================="

      - name: 🤖 Iniciar Evelly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YTDLP_JS_RUNTIMES: bun

        run: |
          echo "=============================================="
          echo "🚀 INICIANDO EVELLY"
          echo "=============================================="
          echo "⏱️ Tempo máximo deste ciclo: 5h50"
          echo "🔄 Após o ciclo, uma nova execução será criada."
          echo "=============================================="
          echo ""

          python bot.py

      - name: 🔄 Solicitar reinício da Evelly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=============================================="
          echo "🔄 PREPARANDO NOVO CICLO"
          echo "=============================================="

          echo "📡 Solicitando nova execução..."

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="evelly_restart"

          echo "✅ Novo ciclo solicitado!"
          echo "=============================================="