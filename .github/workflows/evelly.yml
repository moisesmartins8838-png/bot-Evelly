name: Evelly Online

on:
  workflow_dispatch:

  push:
    branches:
      - main

  repository_dispatch:
    types:
      - evelly_restart

permissions:
  contents: write

concurrency:
  group: evelly-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Evelly Online
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # BAIXAR CÃƒâ€œDIGO
      # ==========================================
      - name: Ã°Å¸â€œÂ¥ Baixar cÃƒÂ³digo da Evelly
        uses: actions/checkout@v6


      # ==========================================
      # PYTHON
      # ==========================================
      - name: Ã°Å¸ÂÂ Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"


      # ==========================================
      # BUN
      # ==========================================
      - name: Ã°Å¸Å¸Â£ Instalar Bun
        uses: oven-sh/setup-bun@v2


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Ã°Å¸Å¸Â¢ Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ==========================================
      # DEPENDÃƒÅ NCIAS PYTHON
      # ==========================================
      - name: Ã°Å¸â€œÂ¦ Instalar dependÃƒÂªncias
        run: |
          python -m pip install --upgrade pip

          echo "=============================================="
          echo "Ã°Å¸â€œÂ¦ INSTALANDO DEPENDÃƒÅ NCIAS"
          echo "=============================================="

          pip install -r requirements.txt

          echo ""
          echo "Ã°Å¸â€œÂº Atualizando yt-dlp..."
          python -m pip install -U "yt-dlp[default]"

          echo ""
          echo "Ã°Å¸â€Â Instalando PO Token Provider..."
          python -m pip install -U bgutil-ytdlp-pot-provider

          echo ""
          echo "=============================================="
          echo "Ã°Å¸â€Å½ VERSÃƒâ€¢ES"
          echo "=============================================="

          python --version

          echo ""
          echo "Ã°Å¸â€œÂº yt-dlp:"
          python -m pip show yt-dlp

          echo ""
          echo "Ã°Å¸â€Â bgutil:"
          python -m pip show bgutil-ytdlp-pot-provider

          echo ""
          echo "Ã°Å¸Å¸Â£ Bun:"
          bun --version
          which bun

          echo ""
          echo "Ã°Å¸Å¸Â¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "=============================================="


      # ==========================================
      # BGUTIL PO TOKEN SERVER
      # ==========================================
      - name: Ã°Å¸â€Â Preparar servidor PO Token
        run: |
          echo "=============================================="
          echo "Ã°Å¸â€Â CONFIGURANDO BGUTIL PO TOKEN PROVIDER"
          echo "=============================================="

          git clone --depth 1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo ""
          echo "Ã°Å¸â€œÂ¦ Instalando dependÃƒÂªncias do provider..."
          npm ci

          echo ""
          echo "Ã°Å¸â€ºÂ Ã¯Â¸Â Compilando provider..."
          npx tsc

          echo ""
          echo "Ã°Å¸Å¡â‚¬ Iniciando servidor PO Token..."

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          cd ../..

          echo ""
          echo "Ã¢ÂÂ³ Aguardando servidor..."
          sleep 5

          echo ""
          echo "Ã°Å¸â€œÂ¡ Testando servidor PO Token..."

          curl --fail \
            --max-time 10 \
            http://127.0.0.1:4416/ping

          echo ""
          echo "=============================================="
          echo "Ã¢Å“â€¦ PO TOKEN PROVIDER ONLINE"
          echo "=============================================="


      # ==========================================
      # JAVA 17 - LAVALINK
      # ==========================================
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # LAVALINK 4.2.2
      # ==========================================
      - name: Instalar e iniciar Lavalink
        run: |
          mkdir -p lavalink
          cd lavalink
          wget -q https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar

          cat > application.yml <<'EOF'
          server:
            port: 2333

          lavalink:
            server:
              password: "evelly123"
              sources:
                youtube: false
                soundcloud: true
                bandcamp: true
                twitch: true
                vimeo: true
                http: true

            plugins:
              - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
                repository: "https://maven.lavalink.dev/releases"

          plugins:
            youtube:
              enabled: true
              allowSearch: true
              allowDirectVideoIds: true
              allowDirectPlaylistIds: true
              clients:
                - MUSIC
                - WEB
                - WEBEMBEDDED
                - MWEB
                - ANDROID_VR

          logging:
            level:
              root: INFO
              lavalink: INFO
          EOF

          nohup java -jar Lavalink.jar > lavalink.log 2>&1 &

          echo "Aguardando Lavalink iniciar..."

          for i in {1..60}; do
            if curl -s http://127.0.0.1:2333/version > /dev/null; then
              echo "Lavalink iniciado com sucesso!"
              break
            fi
            sleep 2
          done

          echo "===== LOG DO LAVALINK ====="
          tail -n 50 lavalink.log

      # ==========================================
      # FFMPEG
      # ==========================================
      - name: Ã°Å¸Å½Âµ Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=============================================="
          echo "Ã°Å¸Å½Âµ FFMPEG"
          echo "=============================================="

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo ""
          echo "=============================================="


      # ==========================================
      # PREPARAR COOKIES DO YOUTUBE
      # ==========================================
      - name: Ã°Å¸â€Â Preparar cookies do YouTube
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=============================================="
          echo "Ã°Å¸â€Â BAIXANDO COOKIES DO YOUTUBE"
          echo "=============================================="

          COOKIE_URL="${SUPABASE_URL}/storage/v1/object/evelly-private/cookies.txt"

          echo "Ã°Å¸â€œÂ¥ Baixando cookies do bucket privado..."

          curl -fL \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$COOKIE_URL" \
            -o "$RUNNER_TEMP/youtube_cookies.txt"

          if [ ! -s "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "Ã¢ÂÅ’ ERRO: arquivo de cookies nÃƒÂ£o foi baixado."
            exit 1
          fi

          echo "Ã¢Å“â€¦ Cookies baixados com sucesso."
          echo "Ã°Å¸â€œÂ Arquivo temporÃƒÂ¡rio preparado."

          echo ""
          echo "Ã°Å¸â€œÂ Tamanho do arquivo:"
          wc -c < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "Ã°Å¸â€œâ€ž Quantidade de linhas:"
          wc -l < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "=============================================="
          echo "Ã¢Å“â€¦ COOKIES PREPARADOS"
          echo "=============================================="
      # ==========================================
      # TESTAR DISCORD
      # ==========================================
      - name: Ã°Å¸Å’Â Testar conexÃƒÂ£o com Discord
        run: |
          echo "=============================================="
          echo "Ã°Å¸Å’Â TESTANDO DISCORD"
          echo "=============================================="

          curl -A "EvellyBot/1.0" \
            -i \
            --max-time 15 \
            https://discord.com/api/v10/gateway

          echo ""
          echo "=============================================="


      # ==========================================
      # TESTAR YT-DLP + PO TOKEN
      # ==========================================
      - name: Ã°Å¸â€œÂº Testar yt-dlp
        run: |
          echo "=============================================="
          echo "Ã°Å¸â€œÂº TESTANDO YT-DLP"
          echo "=============================================="

          python -m yt_dlp --version

          echo ""
          echo "Ã°Å¸Å¸Â£ Bun:"
          bun --version
          which bun

          echo ""
          echo "Ã°Å¸Å¸Â¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "Ã°Å¸ÂÂª Arquivo de cookies:"
          if [ -f "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "Ã¢Å“â€¦ youtube_cookies.txt encontrado."
            wc -c < "$RUNNER_TEMP/youtube_cookies.txt"
          else
            echo "Ã¢ÂÅ’ youtube_cookies.txt NÃƒÆ’O encontrado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Ã°Å¸â€Â TESTANDO PO TOKEN PROVIDER"
          echo "=============================================="

          set +e

          python -m yt_dlp \
            --js-runtimes node \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --verbose \
            --skip-download \
            "https://www.youtube.com/watch?v=eyBhxuONsOA" \
            2>&1 | tee "$RUNNER_TEMP/ytdlp-test.log"

          YTDLP_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "=============================================="
          echo "Ã°Å¸â€Â FIM DO TESTE PO TOKEN"
          echo "=============================================="

          echo ""
          echo "Ã°Å¸â€œÅ  CÃƒÂ³digo de saÃƒÂ­da do yt-dlp: $YTDLP_EXIT"

          echo ""
          echo "=============================================="
          echo "Ã°Å¸â€Å½ RESUMO DO DIAGNÃƒâ€œSTICO"
          echo "=============================================="

          grep -Ei \
            "pot|bgutil|token|javascript|runtime|youtube|cookie|login|playability" \
            "$RUNNER_TEMP/ytdlp-test.log" \
            | head -n 180 || true

          echo ""
          echo "=============================================="

          if [ "$YTDLP_EXIT" -ne 0 ]; then
            echo "Ã¢Å¡Â Ã¯Â¸Â O teste do yt-dlp falhou."
            echo "Ã¢Å¡Â Ã¯Â¸Â Isso NÃƒÆ’O impede o diagnÃƒÂ³stico."
            echo "Ã¢Å¡Â Ã¯Â¸Â O log completo foi preservado acima."
          else
            echo "Ã¢Å“â€¦ TESTE DO YT-DLP CONCLUÃƒÂDO COM SUCESSO."
          fi


      # ==========================================
      # INICIAR EVELLY
      # ==========================================
      - name: Ã°Å¸Â¤â€“ Iniciar Evelly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_COOKIE_FILE: ${{ runner.temp }}/youtube_cookies.txt

        run: |
          echo "=============================================="
          echo "Ã°Å¸Å¡â‚¬ INICIANDO EVELLY"
          echo "=============================================="

          echo "Ã¢ÂÂ±Ã¯Â¸Â Tempo mÃƒÂ¡ximo deste ciclo: 5h50"
          echo "Ã°Å¸â€â€ž ApÃƒÂ³s o ciclo, uma nova execuÃƒÂ§ÃƒÂ£o serÃƒÂ¡ criada."

          echo ""
          echo "Ã°Å¸â€œÂº Runtime JavaScript: Node.js"

          node --version
          node -p "process.execPath"

          echo ""
          echo "Ã°Å¸ÂÂª YouTube Cookies: configurados"

          echo ""
          echo "=============================================="

          python bot.py


      # ==========================================
      # REINICIAR
      # ==========================================
      - name: Ã°Å¸â€â€ž Solicitar reinÃƒÂ­cio da Evelly
        if: always()

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=============================================="
          echo "Ã°Å¸â€â€ž PREPARANDO NOVO CICLO"
          echo "=============================================="

          echo "Ã°Å¸â€œÂ¡ Solicitando nova execuÃƒÂ§ÃƒÂ£o..."

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="evelly_restart"

          echo "Ã¢Å“â€¦ Novo ciclo solicitado!"
          echo "=============================================="

