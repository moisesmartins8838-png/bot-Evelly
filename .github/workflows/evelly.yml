name: Evelly Online

on:
  workflow_dispatch:

  push:
    branches:
      - main

  repository_dispatch:
    types:
      - evelly_restart

permissions:
  contents: write

concurrency:
  group: evelly-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Evelly Online
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # BAIXAR CÃ“DIGO
      # ==========================================
      - name: ðŸ“¥ Baixar cÃ³digo da Evelly
        uses: actions/checkout@v6


      # ==========================================
      # PYTHON
      # ==========================================
      - name: ðŸ Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"


      # ==========================================
      # BUN
      # ==========================================
      - name: ðŸŸ£ Instalar Bun
        uses: oven-sh/setup-bun@v2


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: ðŸŸ¢ Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ==========================================
      # DEPENDÃŠNCIAS PYTHON
      # ==========================================
      - name: ðŸ“¦ Instalar dependÃªncias
        run: |
          python -m pip install --upgrade pip

          echo "=============================================="
          echo "ðŸ“¦ INSTALANDO DEPENDÃŠNCIAS"
          echo "=============================================="

          pip install -r requirements.txt

          echo ""
          echo "ðŸ“º Atualizando yt-dlp..."
          python -m pip install -U "yt-dlp[default]"

          echo ""
          echo "ðŸ” Instalando PO Token Provider..."
          python -m pip install -U bgutil-ytdlp-pot-provider

          echo ""
          echo "=============================================="
          echo "ðŸ”Ž VERSÃ•ES"
          echo "=============================================="

          python --version

          echo ""
          echo "ðŸ“º yt-dlp:"
          python -m pip show yt-dlp

          echo ""
          echo "ðŸ” bgutil:"
          python -m pip show bgutil-ytdlp-pot-provider

          echo ""
          echo "ðŸŸ£ Bun:"
          bun --version
          which bun

          echo ""
          echo "ðŸŸ¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "=============================================="


      # ==========================================
      # BGUTIL PO TOKEN SERVER
      # ==========================================
      - name: ðŸ” Preparar servidor PO Token
        run: |
          echo "=============================================="
          echo "ðŸ” CONFIGURANDO BGUTIL PO TOKEN PROVIDER"
          echo "=============================================="

          git clone --depth 1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo ""
          echo "ðŸ“¦ Instalando dependÃªncias do provider..."
          npm ci

          echo ""
          echo "ðŸ› ï¸ Compilando provider..."
          npx tsc

          echo ""
          echo "ðŸš€ Iniciando servidor PO Token..."

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > ../../bgutil-provider.log 2>&1 &

          cd ../..

          echo ""
          echo "â³ Aguardando servidor..."
          sleep 5

          echo ""
          echo "ðŸ“¡ Testando servidor PO Token..."

          curl --fail \
            --max-time 10 \
            http://127.0.0.1:4416/ping

          echo ""
          echo "=============================================="
          echo "âœ… PO TOKEN PROVIDER ONLINE"
          echo "=============================================="


      # ==========================================
      # JAVA 17 - LAVALINK
      # ==========================================
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # LAVALINK 4.2.2
      # ==========================================
      - name: Instalar e iniciar Lavalink
        run: |
          mkdir -p lavalink
          cd lavalink
          wget -q https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar

          cat > application.yml <<'EOF'
          server:
            port: 2333

          lavalink:
            server:
              password: "evelly123"
              sources:
                youtube: false
                soundcloud: true
                bandcamp: true
                twitch: true
                vimeo: true
                http: true

            plugins:
              - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
                repository: "https://maven.lavalink.dev/releases"

          plugins:
            youtube:
              enabled: true
              allowSearch: true
              allowDirectVideoIds: true
              allowDirectPlaylistIds: true
              clients:
                - MUSIC
                - WEB
                - WEBEMBEDDED
                - MWEB
                - ANDROID_VR

          logging:
            level:
              root: INFO
              lavalink: INFO
          EOF

          nohup java -jar Lavalink.jar > lavalink.log 2>&1 &

          echo "Aguardando Lavalink iniciar..."

          for i in {1..60}; do
            if curl -s http://127.0.0.1:2333/version > /dev/null; then
              echo "Lavalink iniciado com sucesso!"
              break
            fi
            sleep 2
          done

          echo "===== LOG DO LAVALINK ====="
          tail -n 50 lavalink.log

      # ==========================================
      # FFMPEG)
      # ==========================================
      - name: ðŸŽµ Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=============================================="
          echo "ðŸŽµ FFMPEG"
          echo "=============================================="

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo ""
          echo "=============================================="


      # ==========================================
      # PREPARAR COOKIES DO YOUTUBE
      # ==========================================
      - name: ðŸ” Preparar cookies do YouTube
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=============================================="
          echo "ðŸ” BAIXANDO COOKIES DO YOUTUBE"
          echo "=============================================="

          COOKIE_URL="${SUPABASE_URL}/storage/v1/object/evelly-private/cookies.txt"

          echo "ðŸ“¥ Baixando cookies do bucket privado..."

          curl -fL \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$COOKIE_URL" \
            -o "$RUNNER_TEMP/youtube_cookies.txt"

          if [ ! -s "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "âŒ ERRO: arquivo de cookies nÃ£o foi baixado."
            exit 1
          fi

          echo "âœ… Cookies baixados com sucesso."
          echo "ðŸ“ Arquivo temporÃ¡rio preparado."

          echo ""
          echo "ðŸ“ Tamanho do arquivo:"
          wc -c < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "ðŸ“„ Quantidade de linhas:"
          wc -l < "$RUNNER_TEMP/youtube_cookies.txt"

          echo ""
          echo "=============================================="
          echo "âœ… COOKIES PREPARADOS"
          echo "=============================================="
      # ==========================================
      # TESTAR DISCORD
      # ==========================================
      - name: ðŸŒ Testar conexÃ£o com Discord
        run: |
          echo "=============================================="
          echo "ðŸŒ TESTANDO DISCORD"
          echo "=============================================="

          curl -A "EvellyBot/1.0" \
            -i \
            --max-time 15 \
            https://discord.com/api/v10/gateway

          echo ""
          echo "=============================================="


      # ==========================================
      # TESTAR YT-DLP + PO TOKEN
      # ==========================================
      - name: ðŸ“º Testar yt-dlp
        run: |
          echo "=============================================="
          echo "ðŸ“º TESTANDO YT-DLP"
          echo "=============================================="

          python -m yt_dlp --version

          echo ""
          echo "ðŸŸ£ Bun:"
          bun --version
          which bun

          echo ""
          echo "ðŸŸ¢ Node.js:"
          node --version
          which node
          node -p "process.execPath"

          echo ""
          echo "ðŸª Arquivo de cookies:"
          if [ -f "$RUNNER_TEMP/youtube_cookies.txt" ]; then
            echo "âœ… youtube_cookies.txt encontrado."
            wc -c < "$RUNNER_TEMP/youtube_cookies.txt"
          else
            echo "âŒ youtube_cookies.txt NÃƒO encontrado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ðŸ” TESTANDO PO TOKEN PROVIDER"
          echo "=============================================="

          set +e

          python -m yt_dlp \
            --js-runtimes node \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --verbose \
            --skip-download \
            "https://www.youtube.com/watch?v=eyBhxuONsOA" \
            2>&1 | tee "$RUNNER_TEMP/ytdlp-test.log"

          YTDLP_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "=============================================="
          echo "ðŸ” FIM DO TESTE PO TOKEN"
          echo "=============================================="

          echo ""
          echo "ðŸ“Š CÃ³digo de saÃ­da do yt-dlp: $YTDLP_EXIT"

          echo ""
          echo "=============================================="
          echo "ðŸ”Ž RESUMO DO DIAGNÃ“STICO"
          echo "=============================================="

          grep -Ei \
            "pot|bgutil|token|javascript|runtime|youtube|cookie|login|playability" \
            "$RUNNER_TEMP/ytdlp-test.log" \
            | head -n 180 || true

          echo ""
          echo "=============================================="

          if [ "$YTDLP_EXIT" -ne 0 ]; then
            echo "âš ï¸ O teste do yt-dlp falhou."
            echo "âš ï¸ Isso NÃƒO impede o diagnÃ³stico."
            echo "âš ï¸ O log completo foi preservado acima."
          else
            echo "âœ… TESTE DO YT-DLP CONCLUÃDO COM SUCESSO."
          fi


      # ==========================================
      # INICIAR EVELLY
      # ==========================================
      - name: ðŸ¤– Iniciar Evelly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_COOKIE_FILE: ${{ runner.temp }}/youtube_cookies.txt

        run: |
          echo "=============================================="
          echo "ðŸš€ INICIANDO EVELLY"
          echo "=============================================="

          echo "â±ï¸ Tempo mÃ¡ximo deste ciclo: 5h50"
          echo "ðŸ”„ ApÃ³s o ciclo, uma nova execuÃ§Ã£o serÃ¡ criada."

          echo ""
          echo "ðŸ“º Runtime JavaScript: Node.js"

          node --version
          node -p "process.execPath"

          echo ""
          echo "ðŸª YouTube Cookies: configurados"

          echo ""
          echo "=============================================="

          python bot.py


      # ==========================================
      # REINICIAR
      # ==========================================
      - name: ðŸ”„ Solicitar reinÃ­cio da Evelly
        if: always()

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=============================================="
          echo "ðŸ”„ PREPARANDO NOVO CICLO"
          echo "=============================================="

          echo "ðŸ“¡ Solicitando nova execuÃ§Ã£o..."

          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="evelly_restart"

          echo "âœ… Novo ciclo solicitado!"
          echo "=============================================="
